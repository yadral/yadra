name: Validate KSL (phase 0)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate examples (L0+L2+L3)
        run: node ksl/tools/yadra/bin/yadra.mjs validate --layout --semantic ksl/examples/minimal
